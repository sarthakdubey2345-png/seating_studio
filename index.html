56},false,['decrypt']);\n    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},key,b64d(e.ct));\n    hh=JSON.parse(new TextDecoder().decode(pt));hh.id=id;ans={};\n    hh.members.forEach(m=>ans[m.id]={rsvp:m.rsvp==='Yes'||m.rsvp==='No'?m.rsvp:'',meal:m.meal||'',diet:''});\n    view='form';\n  }catch(x){err=L().nf}\n  busy=false;render();\n}\nasync function send(){\n  err='';\n  const list=hh.members.map(m=>Object.assign({gid:m.id},ans[m.id]));\n  if(list.some(a=>!a.rsvp)){err=L().needAns;render();return}\n  if(C.meals.length&&list.some(a=>a.rsvp==='Yes'&&!a.meal)){err=L().needMeal;render();return}\n  busy=true;render();\n  try{\n    const r=await fetch('save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:hh.id,code,answers:list,message,hp:(document.getElementById('hp')||{}).value||''})});\n    const j=await r.json();if(!r.ok||!j.ok)throw 0;view='done';\n  }catch(x){err=L().fail}\n  busy=false;render();\n}\nfunction header(){\n  return`<div class=\"bar\"><div class=\"lang\" role=\"group\" aria-label=\"Language\"><button data-lang=\"en\" aria-pressed=\"${lang==='en'}\">EN<\/button><button data-lang=\"es\" aria-pressed=\"${lang==='es'}\">ES<\/button><\/div><\/div>\n  <header class=\"top\"><div class=\"eyebrow\">${esc(L().reply)}<\/div><h1 class=\"names\">${esc(C.event)}<\/h1><div class=\"rule\"><\/div>\n  <div class=\"when\">${esc(C.date[lang])}<br>${esc(C.venue)}<\/div>${C.deadline[lang]?`<div class=\"by\">${esc(L().by)} ${esc(C.deadline[lang])}<\/div>`:''}<\/header>`;\n}\nfunction render(){\n  const a=document.getElementById('app');let body='';\n  if(view==='code'){\n    body=`<form class=\"card\" id=\"cf\"><h2>${esc(L().find)}<\/h2><p class=\"lead\">${esc(L().findLead)}<\/p>\n      <label class=\"f\">${esc(L().code)}<input class=\"code\" id=\"ci\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" maxlength=\"12\" value=\"${esc(code)}\" placeholder=\"ABC-123\"><\/label>\n      ${err?`<p class=\"err\" role=\"alert\">${esc(err)}<\/p>`:''}<button class=\"btn\" ${busy?'disabled':''}>${esc(busy?'\u2026':L().open)}<\/button><\/form>`;\n  }else if(view==='form'){\n    body=`<form class=\"card\" id=\"ff\"><h2>${esc(L().dear)} ${esc(hh.names)}<\/h2><p class=\"lead\">${esc(L().lead)}<\/p>\n      ${hh.members.map(m=>{const s=ans[m.id];return`<div class=\"person\"><div class=\"pn\">${esc((m.first+' '+m.last).trim())}<\/div>\n        <div class=\"choice\" role=\"group\"><button type=\"button\" class=\"yes\" data-g=\"${m.id}\" data-v=\"Yes\" aria-pressed=\"${s.rsvp==='Yes'}\">${esc(L().yes)}<\/button><button type=\"button\" class=\"no\" data-g=\"${m.id}\" data-v=\"No\" aria-pressed=\"${s.rsvp==='No'}\">${esc(L().no)}<\/button><\/div>\n        ${s.rsvp==='Yes'?`${C.meals.length?`<label class=\"f\">${esc(L().meal)}<select data-g=\"${m.id}\" data-k=\"meal\"><option value=\"\">${esc(L().pick)}<\/option>${C.meals.map(x=>`<option value=\"${esc(x)}\" ${s.meal===x?'selected':''}>${esc(mealName(x))}<\/option>`).join('')}<\/select><\/label>`:''}\n        <label class=\"f\">${esc(L().diet)}<input data-g=\"${m.id}\" data-k=\"diet\" value=\"${esc(s.diet)}\" placeholder=\"${esc(L().opt)}\"><\/label>`:''}<\/div>`}).join('')}\n      <label class=\"f\" style=\"margin-top:22px\">${esc(L().msg)}<textarea id=\"msg\" placeholder=\"${esc(L().opt)}\">${esc(message)}<\/textarea><\/label>\n      <div class=\"hp\" aria-hidden=\"true\"><input id=\"hp\" tabindex=\"-1\" autocomplete=\"off\"><\/div>\n      ${err?`<p class=\"err\" role=\"alert\">${esc(err)}<\/p>`:''}<button class=\"btn\" ${busy?'disabled':''}>${esc(busy?L().sending:L().send)}<\/button><\/form>`;\n  }else{\n    body=`<div class=\"card done\"><h2>${esc(L().thanks)}<\/h2><p class=\"lead\">${esc(L().got)}<\/p>\n      <ul class=\"sum\">${hh.members.map(m=>{const s=ans[m.id];return`<li><b>${esc((m.first+' '+m.last).trim())}<\/b><span>${esc(s.rsvp==='Yes'?L().attending+(s.meal?' \u00b7 '+mealName(s.meal):''):L().declining)}<\/span><\/li>`}).join('')}<\/ul>\n      <button class=\"btn ghost\" id=\"again\">${esc(L().change)}<\/button><\/div>`;\n  }\n  a.innerHTML=header()+body+`<p class=\"foot\">${esc(C.event)}<\/p>`;\n}\ndocument.addEventListener('click',e=>{\n  const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;render();return}\n  const c=e.target.closest('.choice button');if(c){ans[c.dataset.g].rsvp=c.dataset.v;render();return}\n  if(e.target.id==='again'){view='form';render()}\n});\ndocument.addEventListener('input',e=>{const t=e.target;if(t.dataset.g&&t.dataset.k)ans[t.dataset.g][t.dataset.k]=t.value;if(t.id==='msg')message=t.value;if(t.id==='ci')code=t.value});\ndocument.addEventListener('change',e=>{const t=e.target;if(t.dataset.g&&t.dataset.k)ans[t.dataset.g][t.dataset.k]=t.value});\ndocument.addEventListener('submit',e=>{e.preventDefault();if(busy)return;if(e.target.id==='cf')unlock(document.getElementById('ci').value);if(e.target.id==='ff')send()});\nconst q=new URLSearchParams(location.search).get('c');\nrender();if(q){code=q;unlock(q)}\n<\/script>\n<\/body>\n<\/html>\n";
const PHP_SAVE="<?php\n// Mesa RSVP: receives one household's reply and appends it to data/responses.jsonl\nheader('Content-Type: application/json; charset=utf-8');\nheader('Cache-Control: no-store');\n$cfg = require __DIR__ . '/config.php';\nfunction out($code, $arr) { http_response_code($code); echo json_encode($arr); exit; }\nfunction cut($s, $n) { $s = trim((string)$s); return function_exists('mb_substr') ? mb_substr($s, 0, $n) : substr($s, 0, $n); }\nif (($_SERVER['REQUEST_METHOD'] ?? '') !== 'POST') out(405, ['ok' => false]);\n$raw = file_get_contents('php://input', false, null, 0, 20000);\n$d = json_decode($raw, true);\nif (!is_array($d) || !empty($d['hp'])) out(400, ['ok' => false]);\n$id = preg_replace('/[^a-f0-9]/', '', (string)($d['id'] ?? ''));\n$code = preg_replace('/[^A-Z0-9]/', '', strtoupper((string)($d['code'] ?? '')));\nif ($id === '' || !isset($cfg['households'][$id])) out(403, ['ok' => false, 'error' => 'code']);\nif (!hash_equals($id, hash('sha256', 'mesa|' . $cfg['slug'] . '|' . $code))) out(403, ['ok' => false, 'error' => 'code']);\n$allowed = $cfg['households'][$id];\n$answers = [];\nforeach ((array)($d['answers'] ?? []) as $a) {\n  if (!is_array($a)) continue;\n  $gid = (string)($a['gid'] ?? '');\n  if (!in_array($gid, $allowed, true)) continue;\n  $answers[] = [\n    'gid' => $gid,\n    'rsvp' => (($a['rsvp'] ?? '') === 'Yes') ? 'Yes' : 'No',\n    'meal' => cut($a['meal'] ?? '', 40),\n    'diet' => cut($a['diet'] ?? '', 200),\n  ];\n}\nif (!$answers) out(400, ['ok' => false]);\n$rec = ['id' => $id, 'at' => gmdate('c'), 'answers' => $answers, 'message' => cut($d['message'] ?? '', 1000)];\n$dir = __DIR__ . '/data';\nif (!is_dir($dir)) @mkdir($dir, 0750, true);\n$ok = file_put_contents($dir . '/responses.jsonl', json_encode($rec, JSON_UNESCAPED_UNICODE) . \"\\n\", FILE_APPEND | LOCK_EX);\nif ($ok === false) out(500, ['ok' => false]);\nout(200, ['ok' => true]);\n";
const PHP_RESPONSES="<?php\n// Mesa RSVP: downloads the latest reply for every guest as a CSV. Needs ?key=<admin key>.\n$cfg = require __DIR__ . '/config.php';\n$key = (string)($_GET['key'] ?? '');\nif ($key === '' || !hash_equals($cfg['admin_key'], $key)) { http_response_code(403); header('Content-Type: text/plain'); exit('Not allowed.'); }\n$file = __DIR__ . '/data/responses.jsonl';\n$latest = [];\nif (is_file($file)) {\n  foreach (file($file, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {\n    $r = json_decode($line, true);\n    if (!is_array($r) || empty($r['answers'])) continue;\n    foreach ($r['answers'] as $a) {\n      $latest[$a['gid']] = [$a['gid'], $a['rsvp'], $a['meal'], $a['diet'], $r['message'] ?? '', $r['at'] ?? ''];\n    }\n  }\n}\nheader('Content-Type: text/csv; charset=utf-8');\nheader('Cache-Control: no-store');\nheader('Content-Disposition: attachment; filename=\"rsvp-replies-' . $cfg['slug'] . '-' . gmdate('Y-m-d') . '.csv\"');\n$out = fopen('php://output', 'w');\nfwrite($out, \"\\xEF\\xBB\\xBF\");\nfputcsv($out, ['Guest ID', 'RSVP', 'Meal', 'Dietary', 'Message', 'Submitted']);\nforeach ($latest as $row) fputcsv($out, $row);\nfclose($out);\n";

function defaultRsvp(d){return{base:'https://theindiantravellife.com.mx/rsvp',slug:slug(d.event.name),deadline:'',lang:'en',meals:[...MEALS],adminKey:randStr(28,'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'),codes:{},messages:[],lastImport:null,kitAt:null,

function ensureCodes(){let changed=false;const used=new Set(Object.values(S.rsvp.codes));

  if(changed)persist();return S.rsvp.codes}

async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}

async function encryptFor(code,sl,obj,iter){const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);

  const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj))));
  return{iv:b64e(iv),ct:b64e(ct)}}

const SHAPES=[['round','Round'],['oval','Oval'],['rect','Rectangle'],['square','Square'],['head','Head table'],['row','Row of seats'],['u','U-shape'],['e','E-shape']];
function miniShape(k){
  const t={shape:k,seats:k==='zone'?0:{round:8,oval:8,rect:8,square:8,head:5,row:5,u:9,e:13}[k],x:0,y:0,rot:0,w:150,h:90};const G=geom(t);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;const add=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)};
  G.prims.forEach(p=>{if(p.c){add(-p.c[0],-p.c[0]);add(p.c[0],p.c[0])}else if(p.e){add(-p.e[0],-p.e[1]);add(p.e[0],p.e[1])}else{add(p.r[0],p.r[1]);add(p.r[0]+p.r[2],p.r[1]+p.r[3])}});
  G.seats.forEach(s=>{add(s.x-CH,s.y-CH);add(s.x+CH,s.y+CH)});
  const pad=6,w=x1-x0+2*pad,h=y1-y0+2*pad;
  return`<svg viewBox="${x0-pad} ${y0-pad} ${w} ${h}" width="60" height="42" aria-hidden="true">${G.prims.map(p=>primSVG(p,`fill:var(--surface2);stroke:var(--line2);stroke-width:${Math.max(w,h)/60}`)).join('')}${G.seats.map(s=>`<circle cx="${s.x}" cy="${s.y}" r="${CH}" style="fill:var(--accent-soft);stroke:var(--accent);stroke-width:${Math.max(w,h)/60}"/>`).join('')}</svg>`;
}

function drawInspector(){
  const box=$('#insp');if(!box)return;const tn=Object.fromEntries(S.tables.map(t=>[t.id,t.name]));
  const close=`<button class="btn sm icon ghost" id="ix" aria-label="Close">${ic('x',16)}</button>`;
  const g=ui.selGuest&&gById(ui.selGuest),t=!g&&ui.sel&&tById(ui.sel);
  box.hidden=!g&&!t;if(box.hidden){box.innerHTML='';return}
  if(g){const hh=g.party?S.guests.filter(x=>x.party===g.party&&x.id!==g.id):[];const rules=S.prefs.filter(p=>p.a===g.id||p.b===g.id);const st=prefStatus(S)[g.id];
    box.innerHTML=`<div class="ih"><div><span class="eyebrow">Guest${g.vip?' · <span class="vip">VIP</span>':''}</span><h2>${esc(fullName(g))}</h2><p class="meta">${esc(g.group||'No group')}</p></div>${close}</div>
      <div class="facts"><div><span>Seat</span><b>${g.table?esc(tn[g.table])+' · '+(g.seat+1):'Unseated'}</b></div><div><span>Meal</span><b>${esc(g.meal||'Not chosen')}</b></div>
      <div><span>Reply</span><b>${{Yes:'Attending',Pending:'Awaiting',No:'Declined'}[g.rsvp]}</b></div><div><span>Rules</span><b>${rules.length?(st==='bad'?'<span style="color:var(--bad)">Needs a look</span>':'All met'):'None'}</b></div></div>
      ${g.notes?`<p class="hint">${esc(g.notes)}</p>`:''}
      ${hh.length?`<div><span class="eyebrow">Household</span><ul class="slist" style="margin-top:4px">${hh.map(x=>`<li><button data-g="${x.id}">${esc(fullName(x))}<span class="mt">${x.table?esc(tn[x.table]):'Unseated'}</span></button></li>`).join('')}</ul></div>`:''}
      ${rules.length?`<div><span class="eyebrow">Rules</span><ul class="slist" style="margin-top:4px">${rules.map(p=>{const o=gById(p.a===g.id?p.b:p.a);return`<li><button data-g="${o.id}">${p.type==='together'?'With':'Apart from'} ${esc(fullName(o))}</button></li>`}).join('')}</ul></div>`:''}
      <label class="chk"><input type="checkbox" id="gpin" ${g.pinned?'checked':''}> Keep this seat when auto-seating</label>
      <div class="row">${g.table?'<button class="btn sm" id="gun">Unseat</button>':''}<button class="btn sm" id="ged">Edit details</button></div>`;
    $$('[data-g]',box).forEach(b=>b.onclick=()=>{ui.selGuest=b.dataset.g;drawFloor();drawInspector()});
    $('#gpin',box).onchange=e=>{snap();g.pinned=e.target.checked;persist()};
    if(g.table)$('#gun',box).onclick=()=>{snap();g.table=null;g.seat=null;g.pinned=false;persist();floorRefresh()};
    $('#ged',box).onclick=()=>openGuest(g.id);
  }else{const occ=occupancy(S)[t.id]||{},zone=t.shape==='zone';
    box.innerHTML=`<div class="ih"><div><span class="eyebrow">${zone?'Room area':'Table'}</span><h2>${esc(t.name)}</h2>${zone?'':`<p class="meta">${Object.keys(occ).length} of ${t.seats} seats filled</p>`}</div>${close}</div>
      <label class="f">Name<input id="tname" value="${esc(t.name)}"></label>
      ${zone?`<div class="grid2"><label class="f">Width<input type="number" id="tw" min="30" max="1200" step="10" value="${t.w}"></label><label class="f">Depth<input type="number" id="th" min="30" max="1200" step="10" value="${t.h}"></label></div>`
      :`<div class="grid2"><label class="f">Shape<select id="tshape">${SHAPES.map(([k,l])=>`<option value="${k}" ${t.shape===k?'selected':''}>${l}</option>`).join('')}</select></label><label class="f">Seats<input type="number" id="tseats" min="1" max="40" value="${t.seats}"></label></div>`}
      <label class="f">Rotation · <span id="trv">${t.rot||0}°</span><input type="range" id="trot" min="0" max="345" step="15" value="${t.rot||0}"></label>
      ${zone?'':`<label class="chk"><input type="checkbox" id="tvip" ${t.vip?'checked':''}> Reserve for VIP guests</label>`}
      <div class="row"><button class="btn sm" id="tdup">Duplicate</button>${zone?'':'<button class="btn sm" id="tclr">Clear seats</button>'}<button class="btn sm ghost danger" id="tdel">Delete</button></div>
      ${zone?'':`<div><span class="eyebrow">Seated here</span><ul class="slist" style="margin-top:4px">${Array.from({length:t.seats},(_,i)=>{const x=occ[i];return`<li><button ${x?`data-g="${x.id}"`:'disabled'}><span class="sn">${i+1}</span>${x?esc(fullName(x))+(x.meal?`<span class="mt">${esc(x.meal)}</span>`:''):'Empty'}</button></li>`}).join('')}</ul></div>`}`;
    const nm=$('#tname',box);nm.onfocus=()=>snap();nm.oninput=()=>{t.name=nm.value;persist();drawFloor()};
    if(zone){['tw','th'].forEach(k=>{const i=$('#'+k,box);i.onfocus=()=>snap();i.oninput=()=>{const v=+i.value;if(v>=30){t[k==='tw'?'w':'h']=v;persist();drawFloor()}}})}
    else{$('#tshape',box).onchange=e=>{snap();t.shape=e.target.value;if(t.shape==='e'&&t.seats<7)t.seats=7;if(t.shape==='u'&&t.seats<3)t.seats=3;persist();floorRefresh()};
      const se=$('#tseats',box);se.onchange=()=>{let v=Math.round(+se.value);const min=t.shape==='e'?7:t.shape==='u'?3:1;if(!(v>=min))v=min;if(v>40)v=40;snap();t.seats=v;normalize(S);persist();floorRefresh()};
      $('#tvip',box).onchange=e=>{snap();t.vip=e.target.checked;persist();drawFloor()};
      $('#tclr',box).onclick=()=>{snap();S.guests.forEach(g=>{if(g.table===t.id){g.table=null;g.seat=null;g.pinned=false}});persist();floorRefresh()};
      $$('[data-g]',box).forEach(b=>b.onclick=()=>{ui.selGuest=b.dataset.g;drawFloor();drawInspector()})}
    const r=$('#trot',box);r.onpointerdown=()=>snap();r.onkeydown=()=>snap();r.oninput=()=>{t.rot=+r.value;$('#trv',box).textContent=t.rot+'°';persist();drawFloor()};
    $('#tdup',box).onclick=()=>{snap();const c=Object.assign({},t,{id:uid('t'),x:t.x+40,y:t.y+40,name:zone?t.name:nextTableName()});S.tables.push(c);ui.sel=c.id;persist();floorRefresh()};
    $('#tdel',box).onclick=e=>armConfirm(e.currentTarget,()=>{snap();S.tables=S.tables.filter(x=>x.id!==t.id);ui.sel=null;normalize(S);persist();floorRefresh();toast(`${t.name} deleted`)});
  }
  $('#ix',box).onclick=()=>{ui.sel=null;ui.selGuest=null;drawFloor();drawInspector()};
}
function nextTableName(){let n=1;const names=new Set(S.tables.map(t=>t.name));while(names.has('Table '+n))n++;return'Table '+n}
function addTable(shape){snap();const v=ui.vb||{x:0,y:0,w:1500,h:860};
  const t=shape==='zone'?{id:uid('z'),name:'Dance floor',shape:'zone',seats:0,w:200,h:140,x:Math.round(v.x+v.w/2),y:Math.round(v.y+v.h/2),rot:0}
    :{id:uid('t'),name:shape==='head'?'Head table':nextTableName(),shape,seats:{round:10,oval:10,rect:10,square:8,head:8,row:8,u:15,e:20}[shape]||10,x:Math.round(v.x+v.w/2),y:Math.round(v.y+v.h/2),rot:0,vip:false};
  S.tables.push(t);ui.sel=t.id;ui.selGuest=null;persist();floorRefresh();toast(`${t.name} added in the middle of the view. Drag it into place.`)}

/* drag & drop */
let drag=null,rafP=false,hotEl=null;
function onFloorDown(e){
  if(e.button>0)return;
  const seat=e.target.closest('[data-seat]'),tEl=e.target.closest('[data-table]');
  if(seat&&seat.dataset.guest){startGuestDrag(e,[seat.dataset.guest],'seat');return}
  if(seat){ui.sel=seat.dataset.seat.split(':')[0];ui.selGuest=null;drawFloor();drawInspector();return}
  if(tEl){const t=tById(tEl.dataset.table);const p=svgPt(e);drag={kind:'table',id:t.id,dx:p.x-t.x,dy:p.y-t.y,sx:e.clientX,sy:e.clientY,moved:false};
    if(ui.sel!==t.id||ui.selGuest){ui.sel=t.id;ui.selGuest=null;drawFloor();drawInspector()}e.preventDefault();return}
  drag={kind:'pan',sx:e.clientX,sy:e.clientY,vb:Object.assign({},ui.vb),moved:false};e.preventDefault();
}
function onListDown(e){if(e.button>0)return;const c=e.target.closest('.chip'),h=e.target.closest('.ghd');
  if(c)startGuestDrag(e,[c.dataset.gid],'chip');else if(h)startGuestDrag(e,h.dataset.ids.split(','),'group')}
function startGuestDrag(e,ids,from){drag={kind:'guest',ids,from,sx:e.clientX,sy:e.clientY,moved:false};e.preventDefault()}
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved){if(Math.hypot(dx,dy)<5)return;drag.moved=true;
    if(drag.kind==='table')snap();
    if(drag.kind==='guest'){const gh=document.createElement('div');gh.className='ghost-drag';gh.id='ghost';const g=gById(drag.ids[0]);gh.textContent=drag.ids.length>1?`${drag.ids.length} guests`:fullName(g);document.body.appendChild(gh)}}
  if(drag.kind==='table'){const p=svgPt(e),t=tById(drag.id);t.x=Math.round((p.x-drag.dx)/5)*5;t.y=Math.round((p.y-drag.dy)/5)*5;if(!rafP){rafP=true;requestAnimationFrame(()=>{rafP=false;drawFloor()})}}
  else if(drag.kind==='pan'){const r=$('#fsvg').getBoundingClientRect(),v=drag.vb,k=Math.max(v.w/r.width,v.h/r.height);ui.vb={x:v.x-dx*k,y:v.y-dy*k,w:v.w,h:v.h};applyVB()}
  else if(drag.kind==='guest'){const gh=$('#ghost');if(gh){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'}
    const el=document.elementFromPoint(e.clientX,e.clientY);const s=el&&(el.closest('[data-seat]')||el.closest('[data-table]'));
    if(s!==hotEl){if(hotEl)hotEl.classList.remove('hot','hotT');hotEl=s;if(s)s.classList.add(s.dataset.seat?'hot':'hotT')}}
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.kind==='guest'){const gh=$('#ghost');if(gh)gh.remove();if(hotEl){hotEl.classList.remove('hot','hotT');hotEl=null}
    if(!d.moved){if(d.from!=='group'){ui.selGuest=d.ids[0];ui.sel=null;drawFloor();drawInspector()}return}
    const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;
    const seat=el.closest('[data-seat]'),tEl=el.closest('[data-table]'),un=el.closest('#unseated');
    if(seat){const [tid,idx]=seat.dataset.seat.split(':');dropGuests(d.ids,tid,+idx)}
    else if(tEl)dropGuests(d.ids,tEl.dataset.table,null);
    else if(un){const moving=d.ids.map(gById).filter(g=>g.table);if(moving.length){snap();moving.forEach(g=>{g.table=null;g.seat=null;g.pinned=false});persist();floorRefresh()}}
    return}
  if(d.kind==='table'&&d.moved){persist();drawFloor()}
  if(d.kind==='pan'&&!d.moved&&(ui.sel||ui.selGuest)){ui.sel=null;ui.selGuest=null;drawFloor();drawInspector()}
});
document.addEventListener('pointercancel',()=>{const gh=$('#ghost');if(gh)gh.remove();drag=null});
function dropGuests(ids,tid,idx){
  const t=tById(tid);if(!t||t.shape==='zone'){toast('Drop guests on a table or a seat.');return}
  const gs=ids.map(gById).filter(g=>g&&g.rsvp!=='No');if(!gs.length)return;
  snap();const occ=occupancy(S)[tid]||{};
  if(gs.length===1&&idx!=null){const g=gs[0],o=occ[idx];if(o&&o.id===g.id)return;
    if(o){if(g.table){o.table=g.table;o.seat=g.seat}else{o.table=null;o.seat=null;o.pinned=false}}
    g.table=tid;g.seat=idx;g.pinned=true;ui.selGuest=g.id;ui.sel=null;
    toast(o?`${fullName(g)} swapped with ${fullName(o)}`:`${fullName(g)} seated at ${t.name}`)}
  else{const moving=new Set(gs.map(g=>g.id));const freeIdx=[];const start=idx??0;
    for(let k=0;k<t.seats;k++){const i=(start+k)%t.seats;const o=occ[i];if(!o||moving.has(o.id))freeIdx.push(i)}
    gs.forEach(g=>{if(g.table===tid){g.table=null;g.seat=null}});
    let k=0,left=0;for(const g of gs){if(k<freeIdx.length){g.table=tid;g.seat=freeIdx[k++];g.pinned=true}else left++}
    toast(left?`${gs.length-left} seated at ${t.name}. ${left} didn’t fit, the table is full.`:`${gs.length} seated at ${t.name}`)}
  persist();floorRefresh();
}
function openAuto(){
  const pend=S.guests.filter(g=>g.rsvp==='Pending').length,pinned=S.guests.filter(g=>g.pinned&&g.table).length;
  openModal(`<h2>Assign seats automatically</h2>
    <p class="hint">Mesa keeps households together, follows your seating rules, sits people with others from the same group, and saves reserved tables for VIP guests. You can fine-tune by dragging afterwards, and Undo brings back the current plan.</p>
    <label class="chk"><input type="checkbox" id="aPend" checked> Include the ${pend} guests who haven’t replied yet</label>
    <label class="chk"><input type="checkbox" id="aPin" checked> Keep the ${pinned} guests I placed by hand where they are</label>
    <div class="mfoot"><button class="btn" id="aNo">Cancel</button><button class="btn pri" id="aGo">Assign seats</button></div>`,m=>{
    $('#aNo',m).onclick=closeModal;
    $('#aGo',m).onclick=()=>{snap();const r=autoAssignOn(S,{includePending:$('#aPend',m).checked,keepPinned:$('#aPin',m).checked});closeModal();persist();floorRefresh();
      const n=issues(S).length;toast(`${r.placed} guests seated.${r.unplaced?` ${r.unplaced} need more seats.`:''}${n?` ${n} issues to review.`:' All rules met.'}`)};
  });
}
function exportFloorSVG(){
  const b=bbox(S);const head=60;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y-head} ${b.w} ${b.h+head}" width="${Math.round(b.w)}" height="${Math.round(b.h+head)}" font-family="Figtree, Arial, sans-serif"><rect x="${b.x}" y="${b.y-head}" width="${b.w}" height="${b.h+head}" fill="#FFFFFF"/><text x="${b.x+30}" y="${b.y-head+38}" style="fill:#6D3A68;font-size:24px;font-family:Georgia,serif">${esc(S.event.name)} · floor plan</text><text x="${b.x+b.w-30}" y="${b.y-head+38}" text-anchor="end" style="fill:#6A6576;font-size:13px">${esc(fmtDate(S.event.date))} · ${esc(S.event.venue)}</text>${floorSVG(S,C_EXPORT,{colorBy:ui.colorBy,labels:'names'})}</svg>`;
  saveFile(`floor-plan-${slug(S.event.name)}.svg`,svg);
}

const CHART_CSS=`.ch{font-family:var(--cf);color:var(--ci);padding:14mm 12mm}
.ch-head{text-align:center;margin-bottom:9mm}
.ch-title{font-size:34pt;color:var(--ct);line-height:1.1}
.ch-sub{font-family:Montserrat,Arial,sans-serif;font-size:8.5pt;letter-spacing:.24em;text-transform:uppercase;margin-top:3mm;color:var(--ci);opacity:.75}
.ch-rule{width:40mm;height:0;border-top:.4mm solid var(--ct);margin:5mm auto 0}
.ch-grid{display:grid;grid-template-columns:repeat(var(--cc),1fr);gap:7mm 8mm}
.ch-t{break-inside:avoid}
.ch-tn{font-size:15pt;color:var(--ct);border-bottom:.3mm solid var(--ct);padding-bottom:1mm;margin-bottom:2mm}
.ch-t ol{list-style:none;margin:0;padding:0;font-size:11pt;line-height:1.5}
.ch-list{column-count:var(--cc);column-gap:8mm;font-size:11pt;line-height:1.55}
.ch-letter{font-size:17pt;color:var(--ct);margin-top:2mm;break-after:avoid}
.ch-row{display:flex;gap:2mm;align-items:baseline;break-inside:avoid}
.ch-row .ld{flex:1;border-bottom:.3mm dotted currentColor;opacity:.4;transform:translateY(-1mm)}
.ch-row .tb{font-weight:600;white-space:nowrap}
.ch .md{display:inline-block;width:2.4mm;height:2.4mm;border-radius:50%;margin-left:1.6mm;vertical-align:.3mm}`;
function chartMarkup(o){
  const tn=Object.fromEntries(S.tables.map(t=>[t.id,t]));const seated=S.guests.filter(g=>g.table);
  const dot=g=>o.dots&&g.meal?`<i class="md" style="background:${MEAL_COL[g.meal]||GREY}"></i>`:'';
  const sub=o.subtitle||`${S.event.name} · ${fmtDate(S.event.date)}`;
  let body='';
  if(o.order==='table'){body=`<div class="ch-grid">${seatTables(S).map(t=>{const gs=seated.filter(g=>g.table===t.id).sort((a,b)=>a.last.localeCompare(b.last)||a.first.localeCompare(b.first));if(!gs.length)return'';
    return`<div class="ch-t"><div class="ch-tn">${esc(t.name)}</div><ol>${gs.map(g=>`<li>${esc(fullName(g))}${dot(g)}</li>`).join('')}</ol></div>`}).join('')}</div>`}
  else{const gs=seated.slice().sort((a,b)=>a.last.localeCompare(b.last)||a.first.localeCompare(b.first));let L='';
    body=`<div class="ch-list">${gs.map(g=>{const l=(g.last||g.first||'?')[0].toUpperCase();const h=l!==L?`<div class="ch-letter">${esc(l)}</div>`:'';L=l;return h+`<div class="ch-row"><span>${esc(g.last)}${g.last?', ':''}${esc(g.first)}${dot(g)}</span><span class="ld"></span><span class="tb">${esc(tn[g.table].name)}</span></div>`}).join('')}</div>`}
  const legend=o.dots?`<div style="margin-top:8mm;font-family:Montserrat,Arial,sans-serif;font-size:7.5pt;display:flex;gap:4mm;flex-wrap:wrap;justify-content:center">${MEALS.filter(m=>seated.some(g=>g.meal===m)).map(m=>`<span><i class="md" style="background:${MEAL_COL[m]};margin:0 1mm 0 0"></i>${m}</span>`).join('')}</div>`:'';
  return`<div class="ch" style="--cf:${fontCss(o.font)};--ct:${o.titleColor};--ci:${o.ink};--cc:${o.cols}"><div class="ch-head"><div class="ch-title">${esc(o.title)}</div><div class="ch-sub">${esc(sub)}</div><div class="ch-rule"></div></div>${body}${legend}</div>`;
}
function viewCharts(el){
  const o=S.chart;
  el.innerHTML=pageHead('Seating chart','The board guests read on arrival to find their table.',`<button class="btn pri" id="cexp">${ic('download',16)}Export</button>`)+`
  <div class="studio">
    <aside class="card settings">
      <div class="sect"><h3>Layout</h3>
        <div class="seg full" id="cord"><button data-v="table" aria-pressed="${o.order==='table'}">By table</button><button data-v="name" aria-pressed="${o.order==='name'}">By guest name</button></div>
        <label class="f">Columns · <span id="ccv">${o.cols}</span><input type="range" id="ccl" min="1" max="5" value="${o.cols}"></label>
        <label class="chk"><input type="checkbox" id="cdo" ${o.dots?'checked':''}> Meal colour dots</label></div>
      <div class="sect"><h3>Text</h3>
        <label class="f">Heading<input id="cti" value="${esc(o.title)}"></label>
        <label class="f">Subheading<input id="csu" value="${esc(o.subtitle)}" placeholder="${esc(S.event.name+' · '+fmtDate(S.event.date))}"></label></div>
      <div class="sect"><h3>Style</h3>
        <label class="f">Font<select id="cfo">${FONTS.map(([f])=>`<option ${o.font===f?'selected':''}>${f}</option>`).join('')}</select></label>
        <div class="swatches"><label><input type="color" id="cco" value="${o.titleColor}">Heading</label><label><input type="color" id="cin" value="${o.ink}">Text</label></div></div>
    </aside>
    <div class="paperbox"><div class="paper" id="chp" style="width:210mm;max-width:100%"></div></div>
  </div>`;
  const draw=()=>{$('#chp',el).innerHTML=chartMarkup(o)};
  const upd=(k,v)=>{o[k]=v;persist();draw()};
  $('#cord',el).onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#cord button',el).forEach(x=>x.setAttribute('aria-pressed',x===b));upd('order',b.dataset.v)};
  $('#cti',el).oninput=e=>upd('title',e.target.value);$('#csu',el).oninput=e=>upd('subtitle',e.target.value);
  $('#cfo',el).onchange=e=>upd('font',e.target.value);$('#cco',el).oninput=e=>upd('titleColor',e.target.value);$('#cin',el).oninput=e=>upd('ink',e.target.value);
  $('#ccl',el).oninput=e=>{$('#ccv',el).textContent=e.target.value;upd('cols',+e.target.value)};$('#cdo',el).onchange=e=>upd('dots',e.target.checked);
  const rows=()=>{const tn=Object.fromEntries(S.tables.map(t=>[t.id,t.name]));const gs=S.guests.filter(g=>g.table);
    gs.sort(o.order==='table'?(a,b)=>S.tables.findIndex(t=>t.id===a.table)-S.tables.findIndex(t=>t.id===b.table)||a.seat-b.seat:(a,b)=>a.last.localeCompare(b.last));
    return[['Guest','Table','Seat','Meal'],...gs.map(g=>[fullName(g),tn[g.table],g.seat+1,g.meal])]};
  $('#cexp',el).onclick=e=>exportMenu(e.currentTarget,[
    ['Print-ready page','Open it, then print or save as PDF',()=>saveFile(`seating-chart-${slug(S.event.name)}.html`,printDoc('Seating chart',CHART_CSS,chartMarkup(o),'@page{size:A4;margin:0}'))],
    ['Excel spreadsheet','Guest, table, seat and meal',()=>saveXLSX(`seating-chart-${slug(S.event.name)}.xlsx`,[{name:'Seating chart',rows:rows()}])],
    ['CSV file','Works with Word mail merge',()=>saveFile(`seating-chart-${slug(S.event.name)}.csv`,toCSV(rows()))]]);
  draw();
}

const STAT_CSS=`.st{font-family:'Cormorant Garamond',Georgia,serif;color:var(--si)}
.st .c{box-sizing:border-box;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;outline:.25mm dashed #D2CDD9;outline-offset:-.12mm;break-inside:avoid;page-break-inside:avoid;color:var(--si)}

.st .flow{display:flex;flex-wrap:wrap;gap:0;width:190mm}`;
const STAT_TYPES=[['place','Place cards','One per guest · 95 × 55 mm'],['escort','Escort cards','One per guest with table · 85 × 55 mm'],['table','Table cards','One per table with guest list · A6'],['invite','Invitations','One per household · A5'],['thanks','Thank-you letters','One per household · A5'],['labels','Address labels','One per household · 21 per A4 (L7160)']];
function motifHTML(o){
  if(o.motif==='divider')return`<svg class="mo" viewBox="0 0 120 10" width="30mm" height="2.6mm"><line x1="2" y1="5" x2="50" y2="5" style="stroke:${o.accent};stroke-width:.8"/><rect x="56" y="1" width="8" height="8" transform="rotate(45 60 5)" style="fill:${o.accent}"/><line x1="70" y1="5" x2="118" y2="5" style="stroke:${o.accent};stroke-width:.8"/></svg>`;
  if(o.motif==='mono'){const m=(o.monogram||S.event.name.split('&').map(s=>s.trim()[0]||'').join('&')).split('&');return`<div class="mono">${esc(m[0]||'')}${m.length>1?`<span>&amp;</span>${esc(m[1])}`:''}</div>`}
  if(o.motif==='image'&&o.image)return`<img class="mimg" src="${o.image}" alt="">`;
  return'';
}
function statItems(o){
  const who=g=>o.who==='all'?g.rsvp!=='No'||o.type==='invite'||o.type==='labels':o.who==='pending'?g.rsvp!=='No':g.rsvp==='Yes';
  const tn=Object.fromEntries(S.tables.map(t=>[t.id,t.name]));const dot=g=>o.dots&&g.meal?`<i class="md" style="background:${MEAL_COL[g.meal]||GREY}"></i>`:'';const mo=motifHTML(o);
  const merge=(tpl,mem)=>{const g=mem[0];const tb=mem.find(x=>x.table);return tpl.replace(/\{(\w+)\}/g,(m,k)=>({names:partyNames(mem),first:g.first,last:g.last,table:tb?tn[tb.table]:'your table',event:S.event.name,date:fmtDate(S.event.date),venue:S.event.venue,code:ensureCodes()[pKey(g)]||'',rsvp_link:rsvpLink(ensureCodes()[pKey(g)]||'')}[k]??m))};
  const gs=S.guests.filter(who);
  switch(o.type){
    case 'place':return gs.map(g=>`<div class="c pc">${mo}<div class="nm">${esc(fullName(g))}</div><div class="cap">${g.table?esc(tn[g.table]):'&nbsp;'}${dot(g)}</div></div>`);
    case 'escort':return gs.slice().sort((a,b)=>a.last.localeCompare(b.last)).map(g=>{const t=g.table?tn[g.table]:'';const m=t.match(/^table\s+(.+)$/i);
      return`<div class="c es"><div class="nm">${esc(fullName(g))}</div>${mo}<div class="cap">${m?'Table':'&nbsp;'}</div><div class="tb">${esc(m?m[1]:t||'—')}</div>${dot(g)?`<div>${dot(g).replace('margin-left:2mm','')}</div>`:''}</div>`});
    case 'table':return seatTables(S).map(t=>{const at=S.guests.filter(g=>g.table===t.id).sort((a,b)=>a.seat-b.seat);return`<div class="c tc"><div class="nm">${esc(t.name)}</div>${mo}${at.length?`<ul>${at.map(g=>`<li>${esc(fullName(g))}</li>`).join('')}</ul>`:''}</div>`});
    case 'invite':case 'thanks':{const tpl=o.type==='invite'?o.invite:o.thanks;
      return parties(gs).map(mem=>`<div class="c iv">${mo}${tpl.split('\n').map(line=>`<p class="${line.includes('{names}')&&line.trim().length<=12?'nm':''}">${esc(merge(line,mem))}</p>`).join('')}</div>`)}
    case 'labels':return parties(gs).map(mem=>{const a=(mem.find(g=>g.address)||{}).address||'';return`<div class="c lb"><b>${esc(partyNames(mem))}</b>${a.split(/,\s*/).map(esc).join('<br>')}</div>`});
  }
  return[];
}
function statDoc(o,items){
  if(o.type==='labels'){const pages=[];for(let i=0;i<items.length;i+=21)pages.push(`<div class="lbsheet" style="page-break-after:always">${items.slice(i,i+21).join('')}</div>`);return pages.join('')}
  if(o.type==='invite'||o.type==='thanks')return items.map(x=>`<div style="page-break-after:always">${x}</div>`).join('');
  return`<div class="flow" style="margin:0 auto">${items.join('')}</div>`;
}
function viewStationery(el){
  const o=S.stat,t=STAT_TYPES.find(x=>x[0]===o.type),tpl=o.type==='invite'||o.type==='thanks';
  el.innerHTML=pageHead('Stationery',`${t[1]} · ${t[2]}`,`<button class="btn pri" id="sxh">${ic('download',16)}Print-ready page</button>`)+`
  <div class="studio">
    <aside class="card settings">
      <div class="sect"><h3>Make</h3><div class="types" id="sty">${STAT_TYPES.map(([k,l,d])=>`<button data-v="${k}" aria-pressed="${o.type===k}"><b>${l}</b><span>${d.split(' · ')[0]}</span></button>`).join('')}</div>
        ${o.type==='table'?'':`<label class="f">For<select id="swho"><option value="attending" ${o.who==='attending'?'selected':''}>Guests who are attending</option><option value="pending" ${o.who==='pending'?'selected':''}>Attending and awaiting reply</option><option value="all" ${o.who==='all'?'selected':''}>Everyone invited</option></select></label>`}</div>
      <div class="sect"><h3>Style</h3>
        <label class="f">Name font<select id="sfo">${FONTS.map(([f])=>`<option ${o.font===f?'selected':''}>${f}</option>`).join('')}</select></label>
        <div class="swatches"><label><input type="color" id="sac" value="${o.accent}">Accent</label><label><input type="color" id="sin" value="${o.ink}">Text</label></div>
        ${o.type==='labels'?'':`<label class="f">Decoration<select id="smo"><option value="none" ${o.motif==='none'?'selected':''}>None</option><option value="divider" ${o.motif==='divider'?'selected':''}>Divider</option><option value="mono" ${o.motif==='mono'?'selected':''}>Monogram</option><option value="image" ${o.motif==='image'?'selected':''}>Your image</option></select></label>
        ${o.motif==='mono'?`<label class="f">Monogram letters<input id="smn" value="${esc(o.monogram)}" placeholder="A&R"></label>`:''}
        ${o.motif==='image'?`<label class="f">Image (PNG, JPG or SVG)<input type="file" id="sim" accept="image/*" style="height:auto;padding:8px"></label>`:''}`}
        ${o.type==='place'||o.type==='escort'?`<label class="chk"><input type="checkbox" id="sdo" ${o.dots?'checked':''}> Meal colour dots for the caterer</label>`:''}</div>
      ${tpl?`<div class="sect"><h3>Wording</h3><textarea id="stx" rows="10">${esc(o.type==='invite'?o.invite:o.thanks)}</textarea><p class="hint">Merge fields: {names} {first} {last} {table} {event} {date} {venue} {code} {rsvp_link}. A line with only {names} is set in the name font.</p></div>`:''}
      <div class="sect"><p class="hint">Cut guides are dashed. Labels fit Avery L7160 sheets (21 per A4). Print at 100% with margins set to “None”.</p></div>
    </aside>
    <div class="paperbox"><div id="stp"></div></div>
  </div>`;
  const draw=()=>{const items=statItems(o);const z={place:.62,escort:.62,table:.55,invite:.42,thanks:.42,labels:.5}[o.type];
    const shown=o.type==='labels'?[statDoc(o,items.slice(0,21))]:items.slice(0,12);
    $('#stp',el).innerHTML=`<div class="st" style="--sf:${fontCss(o.font)};--sa:${o.accent};--si:${o.ink}"><div class="stprev" style="zoom:${z}">${shown.join('')}</div></div><p class="more">${items.length?`Showing ${Math.min(items.length,o.type==='labels'?21:12)} of ${items.length}. The print-ready page includes all of them.`:'Nothing to show yet. Change who this is for, or seat some guests first.'}</p>`};
  const upd=(k,v,full)=>{o[k]=v;persist();full?viewStationery(el):draw()};
  $('#sty',el).onclick=e=>{const b=e.target.closest('button');if(b)upd('type',b.dataset.v,true)};
  const w=$('#swho',el);if(w)w.onchange=e=>upd('who',e.target.value);
  $('#sfo',el).onchange=e=>upd('font',e.target.value);$('#sac',el).oninput=e=>upd('accent',e.target.value);$('#sin',el).oninput=e=>upd('ink',e.target.value);
  const mo=$('#smo',el);if(mo)mo.onchange=e=>upd('motif',e.target.value,true);
  const mn=$('#smn',el);if(mn)mn.oninput=e=>upd('monogram',e.target.value);
  const im=$('#sim',el);if(im)im.onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1.5e6){toast('Pick an image under 1.5 MB.');return}const r=new FileReader();r.onload=()=>upd('image',r.result);r.readAsDataURL(f)};
  const d=$('#sdo',el);if(d)d.onchange=e=>upd('dots',e.target.checked);
  const tx=$('#stx',el);if(tx)tx.oninput=e=>upd(o.type==='invite'?'invite':'thanks',e.target.value);
  $('#sxh',el).onclick=()=>{const items=statItems(o);if(!items.length){toast('Nothing to export yet.');return}
    const page=o.type==='labels'?'@page{size:A4;margin:0}':tpl?'@page{size:A5;margin:0}':'@page{size:A4;margin:10mm}';
    const body=`<div class="st" style="--sf:${fontCss(o.font)};--sa:${o.accent};--si:${o.ink}">${statDoc(o,items)}</div>`;
    saveFile(`${slug(t[1])}-${slug(S.event.name)}.html`,printDoc(t[1],STAT_CSS,body,page))};
  draw();
}

/* ================= REPORTS ================= */
const REPORTS=[
  ['meals','Meals by table','Counts for the caterer, table by table',()=>{const ms=MEALS.filter(m=>S.guests.some(g=>g.table&&g.meal===m));const other=S.guests.some(g=>g.table&&!MEALS.includes(g.meal));
    const cols=['Table',...ms,...(other?['Other / not chosen']:[]),'Total'];const tot=cols.slice(1).map(()=>0);
    const rows=seatTables(S).map(t=>{const gs=S.guests.filter(g=>g.table===t.id);const r=[...ms.map(m=>gs.filter(g=>g.meal===m).length),...(other?[gs.filter(g=>!MEALS.includes(g.meal)).length]:[]),gs.length];r.forEach((v,i)=>tot[i]+=v);return[t.name,...r]});
    return{cols,rows,foot:['Total',...tot]}}],
  ['bytable','Guests by table','Every seat in order, with meal and notes',()=>{const tn=Object.fromEntries(S.tables.map(t=>[t.id,t.name]));const rows=[];
    seatTables(S).forEach(t=>S.guests.filter(g=>g.table===t.id).sort((a,b)=>a.seat-b.seat).forEach(g=>rows.push([t.name,g.seat+1,fullName(g),g.group,g.meal,g.notes])));
    return{cols:['Table','Seat','Guest','Group','Meal','Notes'],rows}}],
  ['special','Special requirements','Dietary needs, access and other notes',()=>{const tn=Object.fromEntries(S.tables.map(t=>[t.id,t.name]));
    return{cols:['Guest','Table','Meal','Notes'],rows:S.guests.filter(g=>g.rsvp!=='No'&&(g.notes||['Vegan','Jain','Child menu'].includes(g.meal))).map(g=>[fullName(g),g.table?tn[g.table]:'Unseated',g.meal,g.notes])}}],
  ['pending','Awaiting replies','Households to chase, with addresses',()=>({cols:['Household','Guests','Group','Side','Address'],rows:parties(S.guests.filter(g=>g.rsvp==='Pending')).map(m=>[partyNames(m),m.length,m[0].group,m[0].side,(m.find(g=>g.address)||{}).address||''])})],
  ['groups','Guests by group','Who is coming from each group',()=>{const rows=groupList(S).map(k=>{const gs=S.guests.filter(g=>g.group===k);return[k,gs.length,gs.filter(g=>g.rsvp==='Yes').length,gs.filter(g=>g.rsvp==='Pending').length,gs.filter(g=>g.rsvp==='No').length,gs.filter(g=>g.table).length]});
    return{cols:['Group','Invited','Attending','Awaiting','Declined','Seated'],rows}}],
  ['tables','Table occupancy','Seats filled and groups at each table',()=>{const occ=occupancy(S);return{cols:['Table','Shape','Seats','Filled','Free','Groups'],rows:seatTables(S).map(t=>{const gs=Object.values(occ[t.id]||{});return[t.name,(SHAPES.find(s=>s[0]===t.shape)||[,''])[1],t.seats,gs.length,t.seats-gs.length,[...new Set(gs.map(g=>g.group))].join('; ')]})}}],
  ['rules','Seating rules','Every rule and whether it’s met',()=>{const tn=Object.fromEntries(S.tables.map(t=>[t.id,t.name]));return{cols:['Guest','Rule','Guest','Status','Note'],rows:S.prefs.map(p=>{const a=gById(p.a),b=gById(p.b);const s=!a.table||!b.table?'Not seated':((p.type==='together')===(a.table===b.table)?'Met':'Broken');return[fullName(a),p.type==='together'?'Seat together':'Keep apart',fullName(b),s,p.note]})}}],
];
function viewReports(el){
  const r=REPORTS.find(x=>x[0]===ui.report)||REPORTS[0],d=r[3]();
  el.innerHTML=pageHead('Reports',r[2],`<button class="btn pri" id="rexp">${ic('download',16)}Export</button>`)+`
  <div class="pills" id="rp">${REPORTS.map(([k,n])=>`<button data-r="${k}" aria-pressed="${k===r[0]}">${n}</button>`).join('')}</div>
  <div class="tcard"><table class="data"><thead><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${d.cols.length}" class="empty">Nothing to report.</td></tr>`}</tbody>${d.foot?`<tfoot><tr>${d.foot.map(v=>`<td>${esc(v)}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
  $('#rp',el).onclick=e=>{const b=e.target.closest('[data-r]');if(b){ui.report=b.dataset.r;viewReports(el)}};
  const rows=()=>[d.cols,...d.rows,...(d.foot?[d.foot]:[])];
  $('#rexp',el).onclick=e=>exportMenu(e.currentTarget,[
    ['Excel spreadsheet',r[1]+' as .xlsx',()=>saveXLSX(`${slug(r[1])}-${slug(S.event.name)}.xlsx`,[{name:r[1],rows:rows()}])],
    ['CSV file',r[1]+' as .csv',()=>saveFile(`${slug(r[1])}-${slug(S.event.name)}.csv`,toCSV(rows()))]]);
}

/* ================= boot ================= */
const VIEWS={dashboard:viewDashboard,guests:viewGuests,collect:viewCollect,prefs:viewPrefs,floor:viewFloor,charts:viewCharts,stationery:viewStationery,reports:viewReports};
document.head.insertAdjacentHTML('beforeend',`<style>${CHART_CSS}${STAT_CSS}</style>`);
$('#tabs').onclick=e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)};
$('#evcard').onclick=openSettings;
$('#sampleImp').onclick=()=>{go('guests');openImport()};
$('#undoBtn').innerHTML=ic('undo',16)+'Undo';
$('#undoBtn').onclick=undo;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!$('#modal').hidden)closeModal()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();undo()}});
S=load();
const h=(location.hash||'').slice(1);if(VIEWS[h])ui.view=h;
render();
</script>
